name: Publish spec to SwaggerHub

on:
  push:
    branches: [main]
    paths:
      - "src/swagger.ts"
      - "src/openapi.yaml"
      - "openapi.json"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Regenerate openapi.json
        run: npm run generate:swagger

      - name: Commit regenerated spec
        run: |
          if [ -n "$(git status --porcelain openapi.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add openapi.json
            git commit -m "chore: regenerate openapi.json"
            git push
          fi

      - name: Publish to SwaggerHub
        if: ${{ secrets.SWAGGERHUB_API_KEY != '' }}
        env:
          SWAGGERHUB_API_KEY: ${{ secrets.SWAGGERHUB_API_KEY }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          VERSION="$(jq -r '.info.version' openapi.json)"
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: ${SWAGGERHUB_API_KEY}" \
            -H "Content-Type: application/json" \
            --data-binary @openapi.json \
            "https://api.swaggerhub.com/apis/${OWNER}/log-service/${VERSION}?force=true")
          BODY="$(printf '%s' "$RESPONSE" | sed '$d')"
          CODE="$(printf '%s' "$RESPONSE" | tail -n1)"
          echo "$BODY"
          if [ "$CODE" -ne 200 ] && [ "$CODE" -ne 201 ]; then
            echo "SwaggerHub publish failed with HTTP $CODE"
            exit 1
          fi