services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      RETENTION_DAYS: 30
      DB_HOST: db
      DB_PORT: 5432
      DASHBOARD_PASSWORD: LogService2026!
      SESSION_SECRET: fts-intern-log-service-secret-key-2026
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: loguser
      POSTGRES_PASSWORD: logpass
      POSTGRES_DB: logdb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U loguser -d logdb" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
