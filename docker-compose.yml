services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      RETENTION_DAYS: 30
      DB_HOST: db
      DB_PORT: 5432
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 256m

  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: loguser
      POSTGRES_PASSWORD: logpass
      POSTGRES_DB: logdb
    ports:
      - "5433:5432"
    volumes:
      - tsdb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U loguser -d logdb" ]
      interval: 5s
      timeout: 5s
      retries: 5
    cpus: 1
    mem_limit: 1g
    command:
      - postgres
      - -c
      - synchronous_commit=off
      - -c
      - shared_buffers=256MB
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_completion_target=0.9

volumes:
  # Renamed from `pgdata` when the db image moved from postgres:16 to timescaledb: Postgres
  # only sets shared_preload_libraries during initdb, so any host still holding the old
  # `pgdata` volume would reuse a data directory without timescaledb preloaded, and
  # CREATE EXTENSION timescaledb would fail on every startup ("must be preloaded").
  tsdb_pgdata:
